# Fontes e séries do FinanceData Lake — apenas yfinance + FRED, cadência diária.
# Extraído de crypto-market-state/conf/base/parameters.yml (bloco yfinance/fred).

global:
  start_date: "2020-10-01"

fred:
  series:

    - id: FEDFUNDS
      name: fed_funds_rate
      category: monetary_policy

    - id: DGS2
      name: us_2y_yield
      category: yield_curve

    - id: DGS3
      name: us_3y_yield
      category: yield_curve

    - id: DGS5
      name: us_5y_yield
      category: yield_curve

    - id: DGS10
      name: us_10y_yield
      category: yield_curve

    - id: CPIAUCSL
      name: cpi
      category: inflation

    - id: UNRATE
      name: unemployment_rate
      category: labor_market

    - id: WALCL
      name: fed_balance_sheet
      category: liquidity

    - id: INDPRO
      name: industrial_production
      category: growth

    - id: PAYEMS
      name: nonfarm_payrolls
      category: growth

    - id: STLFSI4
      name: macro_financial_stress_index
      category: macro_risk

    - id: RRPONTSYD
      name: macro_reverse_repo_balance
      category: macro_liquidity

    - id: TEDRATE
      name: macro_ted_spread
      category: macro_credit

    - id: T10YIE
      name: breakeven_10y
      category: inflation

yfinance:
  indices:

    - ticker: "^VIX"
      name: vix
      category: volatility

    - ticker: "DX-Y.NYB"
      name: dxy
      category: fx

